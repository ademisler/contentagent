<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Sparkle">
  <defs>
    <filter id="aca-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#aca-glow)">
    <path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3z">
      <animate attributeName="opacity" values="1;0.7;1" dur="1.8s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" values="0 12 12;360 12 12" dur="6s" repeatCount="indefinite" />
    </path>
  </g>

  <g>
    <circle cx="6" cy="6" r="1" fill="currentColor">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="r" values="0.6;1.6;0.6" dur="2.2s" begin="0s" repeatCount="indefinite" />
    </circle>
    <circle cx="18" cy="8" r="0.9" fill="currentColor">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.4s" repeatCount="indefinite" />
      <animate attributeName="r" values="0.5;1.4;0.5" dur="2s" begin="0.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="8" cy="18" r="0.8" fill="currentColor">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="0.4;1.2;0.4" dur="2.4s" begin="0.8s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
